name: pipeline

on:
  pull_request:
    branches: [develop_vagogrecco]
  push:
    branches: [develop_vagogrecco]
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar"
        type: choice
        options: [deploy, destroy]
        default: deploy

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  ci:
    name: CI
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check

      - name: Terraform init (sin backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Validar scripts
        run: |
          shellcheck scripts/*.sh
          bash -n scripts/*.sh

      - name: Preparar HTML
        run: bash scripts/build.sh "${{ github.sha }}"

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/
