name: Pipeline CI/CD

on:
  pull_request:
    branches: [develop_POSSE]
  push:
    branches: [develop_POSSE]
  workflow_dispatch:
    inputs:
      accion:
        description: "Acción a ejecutar"
        type: choice
        options: [deploy, destroy]
        default: deploy

permissions:
  contents: read

# Evita que dos ejecuciones modifiquen la infraestructura al mismo tiempo
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::841770988025:role/github-actions-pipeline

jobs:
  # ---------------- CI ----------------
  ci:
    name: CI - Validar y preparar artefacto
    if: github.event_name != 'workflow_dispatch' || inputs.accion == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Revisar formato de Terraform
        run: terraform fmt -check -recursive

      - name: Validar Terraform (infra)
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      - name: Validar Terraform (bootstrap)
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap validate

      - name: Validar scripts
        run: shellcheck scripts/*.sh

      - name: Preparar el HTML
        run: ./scripts/build.sh "${{ github.sha }}"

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ---------------- CD ----------------
  cd:
    name: CD - Desplegar en AWS
    needs: ci
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.accion == 'deploy')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Autenticarse en AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Descargar artefacto de CI
        uses: actions/download-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: dist

      - name: Terraform init
        run: terraform -chdir=infra init -input=false

      - name: Terraform plan
        run: terraform -chdir=infra plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=infra apply -input=false tfplan

      - name: Leer outputs de Terraform
        id: tf
        run: |
          echo "bucket=$(terraform -chdir=infra output -raw artefactos_bucket)" >> "$GITHUB_OUTPUT"
          echo "instance_id=$(terraform -chdir=infra output -raw instance_id)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform -chdir=infra output -raw url)" >> "$GITHUB_OUTPUT"

      - name: Publicar artefacto por SSM
        run: ./scripts/deploy.sh "${{ steps.tf.outputs.bucket }}" "${{ steps.tf.outputs.instance_id }}" "${{ github.sha }}"

      - name: Verificar por HTTP
        run: ./scripts/verify.sh "${{ steps.tf.outputs.url }}" "${{ github.sha }}"

      - name: Resumen
        run: |
          echo "### Web publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.tf.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------- DESTROY ----------------
  destroy:
    name: Destroy - Eliminar infraestructura
    if: github.event_name == 'workflow_dispatch' && inputs.accion == 'destroy'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Autenticarse en AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir=infra init -input=false

      - name: Terraform destroy
        run: terraform -chdir=infra destroy -auto-approve -input=false
