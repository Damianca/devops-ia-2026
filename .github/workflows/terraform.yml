# Nombre mostrado en GitHub Actions.
name: Terraform AWS - laboratorio

on:
  # Ejecuta el workflow en PRs que cambien infraestructura o este workflow.
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform.yml']

  # En push, solo para mi rama y si cambian esas rutas (solo valida, no despliega).
  push:
    branches: [develop_20oct26_GALLEGUILLO]
    paths: ['infra/**', '.github/workflows/terraform.yml']

  # Permite iniciar manualmente plan, apply o destroy desde la pestaña Actions.
  workflow_dispatch:
    inputs:
      operation:
        description: "plan, apply o destroy"
        required: true
        type: choice
        options: [plan, apply, destroy]
      confirmation:
        description: "Para destroy escribir DESTROY"
        required: false
        type: string

# Permisos mínimos globales; deploy agrega id-token para autenticación OIDC con AWS.
permissions:
  contents: read

jobs:
  # Validaciones sin acceso al backend remoto ni despliegue.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'

      # Comprueba el formato sin modificar archivos.
      - run: terraform fmt -check -recursive
        working-directory: infra

      # Inicializa Terraform sin configurar el backend remoto.
      - run: terraform init -backend=false
        working-directory: infra

      - run: terraform validate
        working-directory: infra

  # Solo corre en ejecución manual y únicamente desde mi rama.
  # plan y apply corren directo; destroy exige escribir exactamente DESTROY.
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop_20oct26_GALLEGUILLO' && (inputs.operation == 'plan' || inputs.operation == 'apply' || (inputs.operation == 'destroy' && inputs.confirmation == 'DESTROY')) }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Habilita OIDC para asumir el rol de AWS sin credenciales estáticas.
      contents: read
    concurrency:
      group: terraform-lab-galleguillo # Evita ejecuciones simultáneas de mi laboratorio.
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'

      # Asume en AWS mi rol mediante OIDC (token temporal, sin claves guardadas).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_GALLEGUILLO }}
          aws-region: us-east-1

      # Inicializa el backend remoto usando mi bucket de estado.
      - name: Init remoto
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_GALLEGUILLO }}" -backend-config="region=us-east-1"

      # Genera y guarda el plan; destroy agrega -destroy al plan.
      - name: Plan
        env:
          TF_VAR_bucket_name: ${{ vars.LAB_BUCKET_NAME_GALLEGUILLO }}
          TF_VAR_http_cidr: ${{ vars.LAB_HTTP_CIDR_GALLEGUILLO }}
        run: terraform plan -out=tfplan ${{ github.event.inputs.operation == 'destroy' && '-destroy' || '' }}

      # Aplica exactamente el plan guardado. Si la operación es "plan", este paso se omite.
      - name: Apply del plan
        if: ${{ inputs.operation != 'plan' }}
        env:
          TF_VAR_bucket_name: ${{ vars.LAB_BUCKET_NAME_GALLEGUILLO }}
          TF_VAR_http_cidr: ${{ vars.LAB_HTTP_CIDR_GALLEGUILLO }}
        run: terraform apply -auto-approve tfplan
