# Mismo archivo que en develop_20oct26: asi aparece el boton "Run workflow"
# (workflow_dispatch) y se puede elegir la rama develop_20oct26_santalucia.
name: Terraform AWS - laboratorio

on:
  # PRs que cambien infraestructura o este workflow: solo validacion.
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform.yml']

  # Push a MI rama: validate + plan + apply.
  push:
    branches: [develop_20oct26_santalucia]
    paths: ['infra/**', '.github/workflows/terraform.yml']

  # Manual: plan, apply o destroy (destroy exige escribir DESTROY).
  workflow_dispatch:
    inputs:
      operation:
        description: "plan, apply o destroy"
        required: true
        type: choice
        options: [plan, apply, destroy]
      confirmation:
        description: "Para destroy escribir DESTROY"
        required: false
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.10.5'
  TF_IN_AUTOMATION: 'true'
  # Variables del repo con prefijo propio para no pisar las de otros alumnos
  TF_VAR_bucket_name: ${{ vars.SANTALUCIA_CLASE11_BUCKET_NAME }}
  TF_VAR_http_cidr: ${{ vars.SANTALUCIA_CLASE11_HTTP_CIDR }}

jobs:
  # ----------------------------- Validacion sin credenciales ni backend
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # ----------------------------- Plan / apply / destroy con OIDC
  deploy:
    needs: validate
    if: >-
      github.ref == 'refs/heads/develop_20oct26_santalucia' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.operation == 'plan' || inputs.operation == 'apply' ||
         (inputs.operation == 'destroy' && inputs.confirmation == 'DESTROY'))))
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: credenciales temporales, sin claves guardadas
      contents: read
    concurrency:
      group: terraform-devops-clase11-santalucia # un solo run a la vez sobre el estado
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Credenciales AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SANTALUCIA_CLASE11_ROLE_ARN }}
          role-session-name: DevOPS_Clase11-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init remoto
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.SANTALUCIA_CLASE11_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"

      # destroy agrega -destroy al plan
      - name: Plan
        run: terraform plan -input=false -out=tfplan ${{ inputs.operation == 'destroy' && '-destroy' || '' }}

      # Aplica exactamente el plan guardado (se omite si la operacion es "plan")
      - name: Apply del plan
        if: ${{ inputs.operation != 'plan' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Outputs
        if: ${{ inputs.operation != 'plan' && inputs.operation != 'destroy' }}
        run: terraform output
