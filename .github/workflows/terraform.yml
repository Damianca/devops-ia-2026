name: Terraform AWS - laboratorio
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform.yml']
  push:
    branches: [develop_20oct26]
    paths: ['infra/**', '.github/workflows/terraform.yml']
  workflow_dispatch:
    inputs:
      operation:
        description: "apply o destroy"
        required: true
        type: choice
        options: [apply, destroy]
      confirmation:
        description: "Para destroy escribir DESTROY"
        required: false
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra
  deploy:
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'apply' || (inputs.operation == 'destroy' && inputs.confirmation == 'DESTROY')) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: terraform-lab-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Init remoto
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=us-east-1"
      - name: Plan
        env:
          TF_VAR_bucket_name: ${{ vars.LAB_BUCKET_NAME }}
          TF_VAR_http_cidr: ${{ vars.LAB_HTTP_CIDR }}
        run: terraform plan -out=tfplan ${{ github.event.inputs.operation == 'destroy' && '-destroy' || '' }}
      - name: Apply del plan
        env:
          TF_VAR_bucket_name: ${{ vars.LAB_BUCKET_NAME }}
          TF_VAR_http_cidr: ${{ vars.LAB_HTTP_CIDR }}
        run: terraform apply -auto-approve tfplan
