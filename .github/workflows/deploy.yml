name: 'Deploy Infra with Terraform'

on:
  push:
    branches: [ "develop_TAVELLA" ]
  pull_request:
    branches: [ "develop_TAVELLA" ]

jobs:
  terraform:
    name: 'Terraform Plan & Apply'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pipelineThiago

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: latest

    # Crea el bucket que guarda el estado, solo si no existe todavía
    - name: Bootstrap state bucket
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        BUCKET="tfstate-${ACCOUNT_ID}-us-east-1"
        echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"
        if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
          aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
          aws s3api put-bucket-versioning --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled
        fi

    - name: Terraform Init
      run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      run: terraform plan -input=false

    - name: Terraform Apply
      if: github.ref == 'refs/heads/develop_TAVELLA' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false
