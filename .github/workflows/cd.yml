name: CD

# Push a develop_TAVELLA  -> CI + plan + apply + publicar por SSM + verificar por HTTP
# Ejecución manual        -> deploy o destroy (solo desde develop_TAVELLA)
on:
  push:
    branches: [ "develop_TAVELLA" ]
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar"
        type: choice
        options:
          - deploy
          - destroy
        default: deploy

# Una sola ejecución a la vez (evita pisarse con el lock del state)
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  # Reutiliza el CI: valida y genera el artefacto que se va a desplegar
  ci:
    name: CI
    if: github.ref == 'refs/heads/develop_TAVELLA' && (github.event_name == 'push' || inputs.action == 'deploy')
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Plan, Apply & Publish
    needs: ci
    if: github.ref == 'refs/heads/develop_TAVELLA' && (github.event_name == 'push' || inputs.action == 'deploy')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # necesario para OIDC
    defaults:
      run:
        working-directory: ./pipelineThiago

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # El mismo artefacto que generó el CI en esta ejecución
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: pipelineThiago/dist

      - name: Verify artifact integrity
        run: cd dist && sha256sum -c index.html.sha256

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TAVELLA }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Ensure state bucket
        run: echo "TF_STATE_BUCKET=$(bash scripts/ensure_state_bucket.sh)" >> "$GITHUB_ENV"

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false tfplan

      - name: Read Terraform outputs
        id: tf
        run: |
          {
            echo "ip=$(terraform output -raw instance_public_ip)"
            echo "instance_id=$(terraform output -raw instance_id)"
            echo "bucket=$(terraform output -raw s3_bucket_name)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish artifact to EC2 (SSM)
        env:
          BUCKET: ${{ steps.tf.outputs.bucket }}
          INSTANCE_ID: ${{ steps.tf.outputs.instance_id }}
        run: bash scripts/deploy_html.sh dist/index.html "$BUCKET" "$INSTANCE_ID" "$GITHUB_SHA"

      - name: Verify over HTTP
        env:
          IP: ${{ steps.tf.outputs.ip }}
        run: bash scripts/verify_http.sh "$IP" "$GITHUB_SHA"

  destroy:
    name: Terraform Destroy
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && github.ref == 'refs/heads/develop_TAVELLA'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./pipelineThiago

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TAVELLA }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Ensure state bucket
        run: echo "TF_STATE_BUCKET=$(bash scripts/ensure_state_bucket.sh)" >> "$GITHUB_ENV"

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Terraform destroy
        run: terraform destroy -auto-approve -input=false
