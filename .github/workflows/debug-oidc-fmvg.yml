name: debug-oidc-fmvg

on:
  push:
    branches: [develop_20oct26_vagogrecco]
    paths: [".github/workflows/debug-oidc-fmvg.yml"]

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar claims del token OIDC
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          tok = json.load(urllib.request.urlopen(req))["value"]
          p = tok.split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ["sub", "aud", "iss", "repository", "ref", "job_workflow_ref"]:
              print(k, "=", c.get(k))
          PY
