AWSTemplateFormatVersion: '2010-09-09'
Description: Ejercicio 2 - EC2 + Security Group + RDS PostgreSQL

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  ExistingRoleName:
    Type: String
    Description: Nombre del rol de IAM ya existente
  KeyName:
    Type: String
    Default: ""
    Description: (Opcional) Key Pair para SSH
  MyIp:
    Type: String
    Description: Tu IP publica en formato CIDR, ej. 190.12.34.56/32
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/32$'
  DBUsername:
    Type: String
    Default: postgresadmin
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Minimo 8 caracteres, sin espacios ni / " @

Conditions:
  HasKey: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ExistingRoleName

  SSHSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH (22) solo desde mi IP
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIp

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL (5432) solo desde la instancia EC2
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt SSHSecurityGroup.GroupId

  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKey, !Ref KeyName, !Ref "AWS::NoValue"]
      SecurityGroupIds:
        - !GetAtt SSHSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: ejercicio1-cloudformation

  MyDB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      DBName: appdb
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      PubliclyAccessible: false
      VPCSecurityGroups:
        - !GetAtt DBSecurityGroup.GroupId

Outputs:
  InstanceId:
    Value: !Ref MyEC2Instance
  PublicIp:
    Value: !GetAtt MyEC2Instance.PublicIp
  DBEndpoint:
    Value: !GetAtt MyDB.Endpoint.Address
