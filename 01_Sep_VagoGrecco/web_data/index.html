<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Córdoba</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #74b9ff, #0984e3); display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #2d3436; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); text-align: center; max-width: 400px; width: 90%; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        h1 { color: #0984e3; font-size: 2rem; margin-bottom: 10px; }
        p { color: #636e72; font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; }
        .img-container { background: #f1f2f6; padding: 10px; border-radius: 12px; display: inline-block; width: 100%; }
        img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Hola Córdoba!</h1>
        <p>Esta página web mejorada se sirve en tiempo real usando <strong>Docker</strong> y un volumen permanente.</p>
        <div class="img-container">
            <img src="cordoba.jpg" alt="Córdoba">
        </div>
    </div>
</body>
</html>
