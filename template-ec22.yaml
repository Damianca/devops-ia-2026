AWSTemplateFormatVersion: '2010-09-09'
Description: Taller DevOps - Ejercicio 2 con EC2, Security Group y RDS PostgreSQL

Resources:
  MyEC2Instance:
    Type: 'AWS::EC2::Instance'
    Properties:
      ImageId: ami-06b21ccaeff8cd686
      InstanceType: t3.micro
      SecurityGroupIds:
        - !Ref WebSecurityGroup

  WebSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Permitir acceso SSH seguro
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  MyDatabase:
    Type: 'AWS::RDS::DBInstance'
    Properties:
      DBInstanceIdentifier: mirdspostgres
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      MasterUsername: dbadmin
      MasterUserPassword: PasswordSeguro123
      PubliclyAccessible: false
