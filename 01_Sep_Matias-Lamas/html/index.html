<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hola Córdoba</title>

   
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            /* Fondo */
            background: linear-gradient(135deg, #00b4db, #0083b0);
        }

        .tarjeta {
            background: white;
            padding: 50px 80px;
            border-radius: 25px;
            text-align: center;

            /* Sombra */
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 60px;
            margin: 0;
            color: #0083b0;
        }

        p {
            font-size: 22px;
            color: #555;
            margin-top: 15px;
        }

        .sol {
            font-size: 50px;
        }
    </style>
</head>

<body>

    <div class="tarjeta">
        <div class="sol">☀️</div>

        <h1>Hola Córdoba-Matias</h1>
        <p>¡Bienvenidos a Córdoba! 🇦🇷</p>
    </div>

</body>
</html>
