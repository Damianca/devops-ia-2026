AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Ejercicio IaC - Aprovisionamiento basico de una instancia EC2 con CloudFormation,
  dentro de una VPC propia (VPC_DevOps_Clase8).
  Autor: Pablo Santalucia

# ---------------------------------------------------------------------------
# Parametros
# ---------------------------------------------------------------------------
Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t2.micro
    Description: Tipo de instancia EC2 (capa gratuita).

  AmiId:
    # AMI fija: al2023-ami-2023.12.20260914.0-kernel-6.18-x86_64 (us-east-1)
    Type: AWS::EC2::Image::Id
    Default: ami-0e34b50e714a297f1
    Description: ID de la AMI al2023-ami-2023.12.20260914.0-kernel-6.18-x86_64 en us-east-1.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: Rango de IPs de la VPC.

  SubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: Rango de IPs de la subred publica.

# ---------------------------------------------------------------------------
# Region determinada: el stack solo se puede crear en us-east-1
# ---------------------------------------------------------------------------
Rules:
  RegionPermitida:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: Este template solo puede desplegarse en la region us-east-1 (N. Virginia).

# ---------------------------------------------------------------------------
# Recursos
# ---------------------------------------------------------------------------
Resources:
  # --- Red -----------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC_DevOps_Clase8
        - Key: Curso
          Value: DevOPS_Clase8

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: IGW_DevOps_Clase8
        - Key: Curso
          Value: DevOPS_Clase8

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref SubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Subnet_Publica_DevOps_Clase8
        - Key: Curso
          Value: DevOPS_Clase8

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: RT_Publica_DevOps_Clase8
        - Key: Curso
          Value: DevOPS_Clase8

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # --- Computo -------------------------------------------------------------
  MiInstanciaEC2:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: DevOPS_Clase8
        - Key: Curso
          Value: DevOPS_Clase8

# ---------------------------------------------------------------------------
# Salidas
# ---------------------------------------------------------------------------
Outputs:
  VpcId:
    Description: ID de la VPC VPC_DevOps_Clase8
    Value: !Ref VPC
  SubnetId:
    Description: ID de la subred publica
    Value: !Ref PublicSubnet
  InstanceId:
    Description: ID de la instancia creada
    Value: !Ref MiInstanciaEC2
  AvailabilityZone:
    Description: Zona de disponibilidad de la instancia
    Value: !GetAtt MiInstanciaEC2.AvailabilityZone
  PublicIp:
    Description: IP publica de la instancia
    Value: !GetAtt MiInstanciaEC2.PublicIp
